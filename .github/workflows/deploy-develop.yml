name: Deploy to Develop

on:
  push:
    branches:
      - develop

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy event on infra repository
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_REPO_PAT }}" \
            https://api.github.com/repos/engineer-yone3/shironeko-server-infra/dispatches \
            -d '{"event_type":"deploy-laravel-sample-to-develop"}'
