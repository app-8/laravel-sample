services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./appRoot:/app
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel_network

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "5173:5173"
    volumes:
      - ./appRoot:/app
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    depends_on:
      - db
    networks:
      - laravel_network

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: laravel_sample_db
      MYSQL_USER: username
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_network

volumes:
  mysql_data:

networks:
  laravel_network:
    driver: bridge
